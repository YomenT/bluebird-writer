[package]
name = "bluebird-writer"
version = "0.1.1"
description = "Bluebird Writer — minimal offline markdown editor for the Bluebird Suite"
edition = "2021"

[lib]
name = "bluebird_writer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5.2.6"
