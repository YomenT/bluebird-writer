# Builds installers for every desktop platform and attaches them to the
# GitHub Release for the pushed version tag (v0.1.0, v0.2.0, …) — creating
# the release if it doesn't exist yet.
name: Release

on:
  push:
    tags: ['v*']

# The default GITHUB_TOKEN is read-only on this repo; releases need write.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04 # AppImage + .deb
          - platform: windows-latest # NSIS installer
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: 1 # AppImage builds need this on some linuxdeploy versions
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Bluebird Writer ${{ github.ref_name }}'
          # Upload into the existing release for this tag (the usual flow:
          # create the release on GitHub, then push the tag), or create it.
          releaseDraft: false
          prerelease: false

      # The user-facing Linux download, same shape as bluebird-focus:
      # a tarball bundling the AppImage with install.sh (desktop entry, icon,
      # ~/.local install — no root).
      - name: Package Linux tarball (AppImage + install.sh)
        if: matrix.platform == 'ubuntu-22.04'
        run: ./package-release.sh

      - name: Attach Linux tarball to the release
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARBALL=$(ls bluebird-writer_*_linux.tar.gz)
          curl -sf -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/gzip" \
            --data-binary @"$TARBALL" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.tauri.outputs.releaseId }}/assets?name=$TARBALL"
